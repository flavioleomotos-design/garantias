<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Garantias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.accordion-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease,opacity .28s ease;opacity:0}
.accordion-detail.open{grid-template-rows:1fr;opacity:1}
.accordion-detail>div{overflow:hidden}
.item-row{cursor:pointer}
.item-row input,.item-row select,.item-row a,.item-row button{cursor:auto}
</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <div id="authOverlay" class="fixed inset-0 z-[100] bg-slate-900/80 flex items-center justify-center p-4"><form id="authForm" class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-7 space-y-4"><h2 class="text-xl font-bold text-center">Entrar no Garantias</h2><input id="loginUsername" autocomplete="username" required placeholder="Usuário" class="w-full border rounded-lg px-3 py-2"><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Senha" class="w-full border rounded-lg px-3 py-2"><button class="w-full bg-indigo-600 text-white rounded-lg py-2">Entrar</button><p id="authError" class="text-sm text-red-600"></p></form></div>
    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-boxes-stacked text-2xl"></i>
                <h1 class="text-xl font-bold">Gestão de Garantias & Produtores</h1>
            </div>
            <div id="syncAdminControls" class="flex items-center gap-3">
                <button onclick="syncWithAPI()" class="bg-indigo-600 hover:bg-indigo-800 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 border border-indigo-500">
                    <i class="fa-solid fa-rotate"></i> Sincronizar Agora
                </button>
                <div id="syncStatusIndicator" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 font-medium shadow-sm">
                    <i class="fa-solid fa-database"></i> Conectado ao Banco
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6 items-start">
        <aside class="w-full md:w-64 md:shrink-0 bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:sticky md:top-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-gray-800"><i class="fa-solid fa-folder-open mr-2 text-indigo-600"></i>Abas</h2>
                <button id="sidebarCreateSheet" onclick="openNewSheetModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-2 rounded-lg font-medium"><i class="fa-solid fa-plus mr-1"></i>Nova</button>
            </div>
            <nav id="sheetTabsContainer" class="flex flex-col gap-1 max-h-[70vh] overflow-y-auto" aria-label="Abas do sistema"></nav>
        </aside>
        <section class="flex-1 min-w-0 w-full flex flex-col gap-6">
        <!-- Ferramentas da Tabela -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <button onclick="openAddItemModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus"></i> Adicionar Novo Item
                </button>
                <button onclick="openNewColumnModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm px-3 py-2 rounded-lg font-medium transition flex items-center gap-2 border border-gray-300">
                    <i class="fa-solid fa-columns"></i> Criar Coluna
                </button>
                <button onclick="openManageColumnsModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm px-3 py-2 rounded-lg font-medium transition flex items-center gap-2 border border-gray-300">
                    <i class="fa-solid fa-eye-slash"></i> Ocultar/Apagar Colunas
                </button>
            </div>
            <div class="w-full md:w-72 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterTable()" placeholder="Pesquisar itens..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <!-- Tabela Principal -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col">
            <div class="overflow-x-auto flex-1">
                <table id="dynamicTable" class="w-full text-left border-collapse text-sm">
                    <thead id="tableHeader" class="bg-gray-100 text-gray-700 uppercase text-xs tracking-wider border-b border-gray-200">
                        <!-- Cabeçalho dinâmico -->
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200 bg-white">
                        <!-- Linhas geradas dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>
        </section>
    </main>

    <!-- Modal Nova Aba -->
    <div id="newSheetModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl flex flex-col gap-4">
            <h2 class="text-lg font-bold text-gray-900">Criar Nova Aba</h2>
            <input type="text" id="newSheetNameInput" placeholder="Nome da Aba (ex: Setor Norte)" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            <div class="flex justify-end gap-3">
                <button onclick="closeNewSheetModal()" class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg">Cancelar</button>
                <button onclick="createSheetSubmit()" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg">Criar</button>
            </div>
        </div>
    </div>

    <!-- Modal Novo Item -->
    <div id="addItemModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
            <h2 class="text-lg font-bold text-gray-900">Adicionar Novo Item</h2>
            <div id="addItemFormFields" class="flex flex-col gap-3">
                <!-- Gerado dinamicamente -->
            </div>
            <div class="flex justify-end gap-3 mt-4">
                <button onclick="closeAddItemModal()" class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg">Cancelar</button>
                <button onclick="saveNewItem()" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Modal Nova Coluna -->
    <div id="newColumnModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl flex flex-col gap-4">
            <h2 class="text-lg font-bold text-gray-900">Criar Nova Coluna</h2>
            <input type="text" id="newColumnNameInput" placeholder="Nome da Coluna Personalizada" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            <div class="flex justify-end gap-3">
                <button onclick="closeNewColumnModal()" class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg">Cancelar</button>
                <button onclick="createColumnSubmit()" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ocultar/Apagar Colunas -->
    <div id="manageColumnsModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl flex flex-col gap-4 max-h-[80vh] overflow-y-auto">
            <h2 class="text-lg font-bold text-gray-900">Gerenciar Colunas</h2>
            <div id="columnsListContainer" class="flex flex-col gap-2">
                <!-- Listagem dinâmica -->
            </div>
            <div class="flex justify-end gap-3 mt-4">
                <button onclick="closeManageColumnsModal()" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_COLUMNS = ['Status', 'Cód. Barras', 'Descrição', 'Fornecedor', 'Defeito', 'Quantidade', 'Imagem', 'Observação', 'Anotações'];
        const API_BASE_URL = '/api/sheets';
        let authToken = sessionStorage.getItem('garantias_token') || '';
        let currentUser = null;
        const authHeaders = () => ({ Authorization: 'Bearer ' + authToken });
        async function login(e) {
            e.preventDefault();
            try {
                const r = await fetch('/api/auth', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUsername.value,password:loginPassword.value})});
                const d = await r.json(); if(!r.ok) throw Error(d.message);
                authToken=d.token;currentUser=d.user;sessionStorage.setItem('garantias_token',authToken);
                authOverlay.classList.add('hidden');applyPermissions();syncWithAPI();
            } catch(err) { authError.textContent=err.message; }
        }
        async function validateSession() {
            if(!authToken){location.replace('/login?next=%2F');return;}
            try {const r=await fetch('/api/auth',{headers:authHeaders()});const d=await r.json();if(!r.ok)throw Error(d.message);currentUser=d.user;authOverlay.classList.add('hidden');applyPermissions();syncWithAPI();}
            catch(e){sessionStorage.removeItem('garantias_token');authToken='';location.replace('/login?next=%2F');}
        }
        function logout(){sessionStorage.removeItem('garantias_token');location.reload();}
        function applyPermissions(){
            const level=currentUser?.accessLevel||3;
            document.getElementById('syncAdminControls')?.classList.toggle('hidden', level !== 1);
            document.querySelectorAll('[onclick="openNewSheetModal()"],[onclick="openNewColumnModal()"],[onclick="openManageColumnsModal()"]').forEach(x=>x.classList.toggle('hidden',level!==1));
            document.querySelectorAll('[onclick="openAddItemModal()"]').forEach(x=>x.classList.toggle('hidden',level>2));
            if(level===1){const a=document.createElement('a');a.href='/admin.html';a.textContent='Administração';a.className='text-white text-sm underline';document.querySelector('header .max-w-7xl').append(a);}
            const b=document.createElement('button');b.textContent='Sair';b.onclick=logout;b.className='bg-indigo-600 text-white px-3 py-2 rounded text-sm';document.querySelector('header .max-w-7xl').append(b);
        }
        document.addEventListener('DOMContentLoaded',()=>authForm.addEventListener('submit',login));

        let state = {
            sheets: {
                'Garantias': {
                    columns: [...DEFAULT_COLUMNS],
                    hiddenColumns: [],
                    customColumns: [],
                    rows: []
                }
            },
            currentSheet: 'Garantias'
        };

        const statusOptions = ['Pendente', 'Saída', 'Separado', 'Enviado', 'Finalizado'];

        function initApp() {
            authOverlay.classList.remove('hidden');
            validateSession();
        }

        function renderAll() {
            renderTabs();
            renderTable();
        }

        function setSyncStatus(isSyncing, isError = false) {
            const ind = document.getElementById('syncStatusIndicator');
            if (isError) {
                ind.className = "text-xs bg-red-500 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 font-medium shadow-sm";
                ind.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Erro de Conexão`;
            } else if (isSyncing) {
                ind.className = "text-xs bg-amber-500 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 font-medium shadow-sm";
                ind.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Sincronizando...`;
            } else {
                ind.className = "text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 font-medium shadow-sm";
                ind.innerHTML = `<i class="fa-solid fa-database"></i> Conectado ao Banco`;
            }
        }

        function renderTabs() {
            const container = document.getElementById('sheetTabsContainer');
            container.innerHTML = '';
            const canManageSheets = currentUser?.accessLevel === 1;
            const createButton = document.getElementById('sidebarCreateSheet');
            if (createButton) createButton.classList.toggle('hidden', !canManageSheets);
            Object.keys(state.sheets).sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true, sensitivity: 'base' })).forEach(sheetName => {
                const isActive = sheetName === state.currentSheet;
                const group = document.createElement('div');
                group.className = 'flex items-center gap-1 w-full';
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `flex-1 min-w-0 text-left px-3 py-2.5 text-sm rounded-lg transition ${isActive ? 'bg-indigo-600 text-white font-semibold' : 'text-gray-700 hover:bg-indigo-50'}`;
                btn.textContent = sheetName;
                btn.onclick = () => { state.currentSheet = sheetName; renderTable(); renderTabs(); };
                group.append(btn);
                if (canManageSheets) {
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.title = 'Excluir aba ' + sheetName;
                    remove.setAttribute('aria-label', 'Excluir aba ' + sheetName);
                    remove.className = 'px-2.5 py-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg';
                    remove.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                    remove.onclick = event => { event.stopPropagation(); deleteSheet(sheetName); };
                    group.append(remove);
                }
                container.appendChild(group);
            });
        }

        function getActiveColumns() {
            const s = state.sheets[state.currentSheet];
            return s.columns.map((col, index) => ({ name: col, index, hidden: s.hiddenColumns.includes(col) }));
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function renderTable() {
            const sheet = state.sheets[state.currentSheet];
            if (!sheet) return;
            const headerTr = document.getElementById('tableHeader');
            const bodyTr = document.getElementById('tableBody');
            headerTr.innerHTML = '';
            bodyTr.innerHTML = '';
            const cols = getActiveColumns();
            const visibleCols = cols.filter(c => !c.hidden);
            headerTr.innerHTML = visibleCols.map(col => `<th class="px-4 py-3 font-semibold">${escapeHtml(col.name)}</th>`).join('') +
                '<th class="px-4 py-3 text-center font-semibold">Ações</th>';

            sheet.rows.forEach((row, rowIndex) => {
                const statusIndex = sheet.columns.findIndex(name => name === 'Status');
                const isClosed = statusIndex >= 0 && String(row[statusIndex] ?? '').trim().toLowerCase() === 'finalizado';
                const canEdit = currentUser && currentUser.accessLevel <= 2;
                const tr = document.createElement('tr');
                tr.className = 'item-row hover:bg-gray-50 transition border-b border-gray-100 cursor-pointer';
                tr.dataset.closed = String(isClosed);
                tr.setAttribute('aria-expanded', 'false');
                tr.innerHTML = visibleCols.map(col => {
                    const val = row[col.index] ?? '';
                    if (col.name === 'Imagem' && val) {
                        return `<td class="px-4 py-3"><a onclick="event.stopPropagation()" href="${escapeHtml(val)}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 underline text-xs">Ver Imagem</a></td>`;
                    }
                    return `<td class="px-4 py-3 text-gray-700">${escapeHtml(val) || '<span class="text-gray-400">—</span>'}</td>`;
                }).join('') + '<td class="px-4 py-3 text-center text-xs text-indigo-600">Clique para expandir</td>';
                tr.addEventListener('click', () => toggleRowDetails(rowIndex, tr));
                bodyTr.appendChild(tr);

                const detailTr = document.createElement('tr');
                detailTr.className = 'bg-indigo-50/60';
                detailTr.innerHTML = `<td colspan="${visibleCols.length + 1}" class="p-0">
                    <div id="details-${rowIndex}" class="accordion-detail">
                        <div><div class="px-5 py-4 border-b border-indigo-100">
                            <div class="flex items-center justify-between gap-3 mb-3">
                                <div class="flex items-center gap-2 text-indigo-800 font-semibold text-xs uppercase tracking-wide"><i class="fa-solid fa-circle-info"></i> Informações completas do item</div>
                                <span class="text-xs ${isClosed ? 'text-amber-700' : 'text-emerald-700'}">${isClosed ? 'Item finalizado: somente status pode ser alterado' : 'Modo de edição'}</span>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                ${cols.map(col => {
                                    const value = row[col.index] ?? '';
                                    const isStatus = col.name === 'Status';
                                    const locked = isClosed && !isStatus;
                                    const editor = !canEdit ? `<span class="text-sm text-gray-700">${escapeHtml(value) || 'Não informado'}</span>` : isStatus
                                        ? `<select onclick="event.stopPropagation()" onchange="updateStatus(${rowIndex}, this.value)" class="detail-editor w-full bg-white text-gray-800 border border-indigo-200 rounded-md px-2 py-1.5 text-sm">${statusOptions.map(opt => `<option value="${escapeHtml(opt)}" ${value === opt ? 'selected' : ''}>${escapeHtml(opt)}</option>`).join('')}</select>`
                                        : `<input type="text" value="${escapeHtml(value)}" ${locked ? 'disabled' : ''} onclick="event.stopPropagation()" onchange="updateCell(${rowIndex}, ${col.index}, this.value)" class="detail-editor w-full bg-white text-gray-800 border border-indigo-200 rounded-md px-2 py-1.5 text-sm ${locked ? 'opacity-60 cursor-not-allowed' : ''}" placeholder="Não informado">`;
                                    return `<label class="bg-white rounded-lg border border-indigo-100 p-3 block"><span class="block text-xs font-semibold text-gray-500 mb-1">${escapeHtml(col.name)}</span>${editor}</label>`;
                                }).join('')}
                            </div>
                            <div class="flex justify-end mt-4">
                                <button type="button" ${(!canEdit || isClosed) ? 'disabled' : ''} onclick="event.stopPropagation(); deleteRow(${rowIndex})" class="text-sm px-3 py-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 disabled:opacity-40 disabled:cursor-not-allowed"><i class="fa-solid fa-trash-can mr-1"></i> Excluir item</button>
                            </div>
                        </div></div>
                    </div>
                </td>`;
                bodyTr.appendChild(detailTr);
            });
            filterTable();
        }

        function toggleRowDetails(rowIndex, rowElement) {
            const details = document.getElementById(`details-${rowIndex}`);
            if (!details) return;
            const isOpen = details.classList.toggle('open');
            rowElement.setAttribute('aria-expanded', String(isOpen));
            rowElement.classList.toggle('bg-indigo-50', isOpen);
        }

        function isItemClosed(rowIndex) {
            const sheet = state.sheets[state.currentSheet];
            const statusIndex = sheet.columns.indexOf('Status');
            return statusIndex >= 0 && String(sheet.rows[rowIndex]?.[statusIndex] ?? '').trim().toLowerCase() === 'finalizado';
        }

        function isRowExpanded(rowIndex) {
            return document.getElementById(`details-${rowIndex}`)?.classList.contains('open') === true;
        }

        function updateCell(rowIndex, colIndex, value) {
            if(currentUser?.accessLevel>2)return;
            if (!isRowExpanded(rowIndex)) {
                alert('Expanda o acordeão do item para editar seus dados.');
                renderTable();
                return;
            }
            if (isItemClosed(rowIndex)) {
                alert('Este item está finalizado. Altere o status para reabri-lo.');
                renderTable();
                return;
            }
            state.sheets[state.currentSheet].rows[rowIndex][colIndex] = value;
            saveAndSync();
        }

        function updateStatus(rowIndex, value) {
            if(currentUser?.accessLevel>2)return;
            if (!isRowExpanded(rowIndex)) {
                alert('Expanda o acordeão do item para alterar o status.');
                renderTable();
                return;
            }
            const sheet = state.sheets[state.currentSheet];
            const statusIndex = sheet.columns.indexOf('Status');
            if (statusIndex < 0 || !sheet.rows[rowIndex]) return;
            sheet.rows[rowIndex][statusIndex] = value;
            renderTable();
            saveAndSync();
        }

        

        function deleteRow(rowIndex) {
            if(currentUser?.accessLevel>2)return;
            if (!isRowExpanded(rowIndex)) {
                alert('Expanda o acordeão do item para excluí-lo.');
                return;
            }
            if (isItemClosed(rowIndex)) {
                alert('Este item está finalizado e não pode ser excluído.');
                return;
            }
            if (confirm('Deseja realmente apagar este item?')) {
                state.sheets[state.currentSheet].rows.splice(rowIndex, 1);
                renderTable();
                saveAndSync();
            }
        }

        async function deleteSheet(sheetName) {
            if (currentUser?.accessLevel !== 1) { alert('Somente administradores de nível 1 podem excluir abas.'); return; }
            const names = Object.keys(state.sheets);
            if (names.length <= 1) {
                alert('Mantenha pelo menos uma aba no painel. Crie outra aba antes de excluir esta.');
                return;
            }
            if (!confirm(`Deseja realmente excluir a aba "${sheetName}" e todos os itens dela? Esta ação não pode ser desfeita.`)) return;
            setSyncStatus(true);
            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json', ...authHeaders() },
                    body: JSON.stringify({ sheetName })
                });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Não foi possível excluir a aba.');
                delete state.sheets[sheetName];
                if (state.currentSheet === sheetName) state.currentSheet = Object.keys(state.sheets)[0];
                renderAll();
                setSyncStatus(false);
            } catch (error) {
                console.error('Erro ao excluir aba:', error);
                setSyncStatus(false, true);
                alert(error.message || 'Erro ao excluir a aba.');
            }
        }

        function normalizeSearchText(value) {
            return String(value ?? '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLocaleLowerCase('pt-BR')
                .trim();
        }

        function filterTable() {
            const input = document.getElementById('searchInput');
            const body = document.getElementById('tableBody');
            const header = document.getElementById('tableHeader');
            if (!input || !body || !header) return;

            const query = normalizeSearchText(input.value);
            if (!query) {
                renderTable();
                return;
            }

            const results = [];
            Object.entries(state.sheets).forEach(([sheetName, sheet]) => {
                const barcodeIndex = sheet.columns.findIndex(name => normalizeSearchText(name) === normalizeSearchText('Cód. Barras'));
                const descriptionIndex = sheet.columns.findIndex(name => normalizeSearchText(name) === normalizeSearchText('Descrição'));
                if (barcodeIndex < 0 && descriptionIndex < 0) return;

                sheet.rows.forEach((row, rowIndex) => {
                    const barcode = barcodeIndex >= 0 ? row[barcodeIndex] : '';
                    const description = descriptionIndex >= 0 ? row[descriptionIndex] : '';
                    if ([barcode, description].some(value => normalizeSearchText(value).includes(query))) {
                        results.push({sheetName, rowIndex, barcode, description});
                    }
                });
            });

            header.innerHTML = '<th class="px-4 py-3 font-semibold">Aba</th><th class="px-4 py-3 font-semibold">Cód. Barras</th><th class="px-4 py-3 font-semibold">Descrição</th>';
            body.innerHTML = '';
            if (!results.length) {
                body.innerHTML = '<tr><td colspan="3" class="px-4 py-6 text-center text-gray-500">Nenhum item encontrado nas colunas Cód. Barras e Descrição.</td></tr>';
                return;
            }

            results.forEach(result => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-100 hover:bg-indigo-50 cursor-pointer';
                tr.innerHTML = '<td class="px-4 py-3 font-medium text-indigo-700"></td><td class="px-4 py-3"></td><td class="px-4 py-3"></td>';
                tr.children[0].textContent = result.sheetName;
                tr.children[1].textContent = result.barcode ?? '';
                tr.children[2].textContent = result.description ?? '';
                tr.addEventListener('click', () => {
                    state.currentSheet = result.sheetName;
                    document.getElementById('searchInput').value = '';
                    renderTabs();
                    renderTable();
                    const row = document.querySelectorAll('#tableBody > tr')[result.rowIndex * 2];
                    if (row) {
                        row.scrollIntoView({behavior:'smooth', block:'center'});
                        toggleRowDetails(result.rowIndex, row);
                    }
                });
                body.appendChild(tr);
            });
        }

        // Modais de Criação
        function openNewSheetModal() { if(currentUser?.accessLevel!==1)return; document.getElementById('newSheetModal').classList.remove('hidden'); }
        function closeNewSheetModal() { document.getElementById('newSheetModal').classList.add('hidden'); }
        function createSheetSubmit() {
            if (currentUser?.accessLevel !== 1) { alert('Somente administradores de nível 1 podem criar abas.'); return; }
            const name = document.getElementById('newSheetNameInput').value.trim();
            if (!name || state.sheets[name]) {
                alert('Nome inválido ou aba já existente.');
                return;
            }
            state.sheets[name] = { columns: [...DEFAULT_COLUMNS], hiddenColumns: [], customColumns: [], rows: [] };
            state.currentSheet = name;
            closeNewSheetModal();
            document.getElementById('newSheetNameInput').value = '';
            renderAll();
            saveAndSync();
        }

        function openAddItemModal() { if(currentUser?.accessLevel>2)return;
            const container = document.getElementById('addItemFormFields');
            container.innerHTML = '';
            const cols = state.sheets[state.currentSheet].columns;
            cols.forEach(col => {
                div = document.createElement('div');
                div.className = 'flex flex-col gap-1';
                if (col === 'Status') {
                    div.innerHTML = `<label class="text-xs font-semibold text-gray-600">${col}</label>
                        <select id="add_${col}" class="border border-gray-300 rounded-lg p-2 text-sm">
                            ${statusOptions.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                        </select>`;
                } else {
                    div.innerHTML = `<label class="text-xs font-semibold text-gray-600">${col}</label>
                        <input type="text" id="add_${col}" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">`;
                }
                container.appendChild(div);
            });
            document.getElementById('addItemModal').classList.remove('hidden');
        }
        function closeAddItemModal() { document.getElementById('addItemModal').classList.add('hidden'); }
        function saveNewItem() {
            const cols = state.sheets[state.currentSheet].columns;
            const newRow = cols.map(col => {
                const el = document.getElementById(`add_${col}`);
                return el ? el.value : '';
            });
            state.sheets[state.currentSheet].rows.push(newRow);
            closeAddItemModal();
            renderTable();
            saveAndSync();
        }

        function openNewColumnModal() { if(currentUser?.accessLevel!==1)return; document.getElementById('newColumnModal').classList.remove('hidden'); }
        function closeNewColumnModal() { document.getElementById('newColumnModal').classList.add('hidden'); }
        function createColumnSubmit() {
            const name = document.getElementById('newColumnNameInput').value.trim();
            const sheet = state.sheets[state.currentSheet];
            if (!name || sheet.columns.includes(name)) {
                alert('Nome de coluna inválido ou já existente.');
                return;
            }
            sheet.columns.push(name);
            sheet.customColumns.push(name);
            sheet.rows.forEach(r => r.push(''));
            closeNewColumnModal();
            document.getElementById('newColumnNameInput').value = '';
            renderTable();
            saveAndSync();
        }

        function openManageColumnsModal() { if(currentUser?.accessLevel!==1)return;
            const container = document.getElementById('columnsListContainer');
            container.innerHTML = '';
            const sheet = state.sheets[state.currentSheet];
            sheet.columns.forEach(col => {
                const isHidden = sheet.hiddenColumns.includes(col);
                const isCustom = sheet.customColumns.includes(col);
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 bg-gray-50 rounded-lg border border-gray-200";
                div.innerHTML = `
                    <span class="text-sm font-medium text-gray-700">${col}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleHideColumn('${col}')" class="text-xs px-2.5 py-1 rounded bg-gray-200 hover:bg-gray-300 text-gray-700">${isHidden ? 'Mostrar' : 'Ocultar'}</button>
                        ${isCustom ? `<button onclick="deleteColumn('${col}')" class="text-xs px-2.5 py-1 rounded bg-red-100 hover:bg-red-200 text-red-600">Apagar</button>` : ''}
                    </div>
                `;
                container.appendChild(div);
            });
            document.getElementById('manageColumnsModal').classList.remove('hidden');
        }
        function closeManageColumnsModal() { document.getElementById('manageColumnsModal').classList.add('hidden'); }

        function toggleHideColumn(col) {
            const sheet = state.sheets[state.currentSheet];
            if (sheet.hiddenColumns.includes(col)) {
                sheet.hiddenColumns = sheet.hiddenColumns.filter(c => c !== col);
            } else {
                sheet.hiddenColumns.push(col);
            }
            openManageColumnsModal();
            renderTable();
            saveAndSync(); // Salva a configuração de colunas ocultas no banco
        }

        function deleteColumn(col) {
            if (!confirm(`Deseja apagar a coluna "${col}"?`)) return;
            const sheet = state.sheets[state.currentSheet];
            const index = sheet.columns.indexOf(col);
            if (index > -1) {
                sheet.columns.splice(index, 1);
                sheet.customColumns = sheet.customColumns.filter(c => c !== col);
                sheet.hiddenColumns = sheet.hiddenColumns.filter(c => c !== col);
                sheet.rows.forEach(r => r.splice(index, 1));
            }
            openManageColumnsModal();
            renderTable();
            saveAndSync();
        }

        // Comunicação com a API Prisma (Vercel Serverless)
        function saveAndSync() {
            setSyncStatus(true);
            const sheetData = state.sheets[state.currentSheet];
            
            fetch(API_BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...authHeaders() },
                body: JSON.stringify({
                    sheetName: state.currentSheet,
                    columns: sheetData.columns,
                    hiddenColumns: sheetData.hiddenColumns,
                    customColumns: sheetData.customColumns,
                    rows: sheetData.rows
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    setSyncStatus(false);
                } else {
                    setSyncStatus(false, true);
                }
            })
            .catch(err => {
                console.error('Erro ao salvar:', err);
                setSyncStatus(false, true);
            });
        }

        function syncWithAPI() {
            setSyncStatus(true);
            fetch(API_BASE_URL, {headers:authHeaders()})
                .then(res => res.json())
                .then(async res => {
                    if (res.status === 'success' && res.sheets) {
                        state.sheets = res.sheets;
                        if(currentUser?.accessLevel===1) await ensureTestSheets();
                        // Define a aba inicial se disponível
                        if (!state.sheets[state.currentSheet]) {
                            state.currentSheet = Object.keys(state.sheets)[0] || 'Garantias';
                        }
                        renderAll();
                        setSyncStatus(false);
                    } else {
                        setSyncStatus(false, true);
                        renderAll();
                    }
                })
                .catch(err => {
                    console.error('Erro ao buscar dados:', err);
                    setSyncStatus(false, true);
                    renderAll();
                });
        }

        window.onload = initApp;
    </script>
