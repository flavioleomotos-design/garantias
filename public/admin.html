<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | Garantias</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 text-slate-800 min-h-screen"><header class="bg-indigo-800 text-white p-4"><div class="max-w-7xl mx-auto flex justify-between"><h1 class="font-bold text-xl">Administração do Garantias</h1><div class="flex gap-2"><a href="/" class="border rounded px-3 py-2">Voltar</a><button id="logout" class="border rounded px-3 py-2">Sair</button></div></div></header><main class="max-w-7xl mx-auto p-4 space-y-4"><div class="bg-white rounded p-4 flex gap-3 items-center"><label>Aba</label><select id="tab" class="border rounded p-2"></select><span id="count" class="text-sm text-slate-500"></span><button id="refresh" class="border rounded p-2 ml-auto">Atualizar</button></div><p id="msg" class="text-sm"></p><div class="bg-white rounded shadow overflow-auto max-h-[55vh]"><table class="min-w-full text-sm"><thead id="head" class="sticky top-0 bg-slate-100"></thead><tbody id="body"></tbody></table></div><section class="bg-white rounded shadow p-4 space-y-3"><h2 class="font-bold">Usuários</h2><div class="grid md:grid-cols-4 gap-2"><input id="nu" placeholder="Novo usuário" class="border rounded p-2"><input id="np" type="password" minlength="8" placeholder="Senha (mín. 8)" class="border rounded p-2"><select id="nl" class="border rounded p-2"><option value="3">Nível 3 — Visualizar</option><option value="2">Nível 2 — Editar</option><option value="1">Nível 1 — Total</option></select><button id="create" class="bg-indigo-600 text-white rounded p-2">Criar usuário</button></div><div class="overflow-auto"><table class="min-w-full text-sm"><thead><tr><th class="p-2 text-left">Usuário</th><th class="p-2">ID</th><th class="p-2">Nível</th><th class="p-2">Ações</th></tr></thead><tbody id="users"></tbody></table></div></section></main><script>
const $=x=>document.getElementById(x),token=sessionStorage.getItem('garantias_token')||'';let tabs=[],users=[],active='',me='',protectedUsername='';
async function api(path,method='GET',data){const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined});const d=await r.json();if(!r.ok)throw Error(d.message||'Erro');return d;}
function message(t,b=false){$('msg').textContent=t;$('msg').className=b?'text-red-600':'text-emerald-700';}
async function load(){const d=await api('/admin');tabs=d.tabs||[];users=d.users||[];me=d.currentUserId;protectedUsername=(d.protectedUsername||'').toLowerCase();if(!tabs.some(x=>x.name===active))active=tabs[0]?.name||'';$('tab').innerHTML='';tabs.forEach(t=>{const o=document.createElement('option');o.value=t.name;o.textContent=t.name;$('tab').append(o);});$('tab').value=active;rows();userRows();}
function rows(){const t=tabs.find(x=>x.name===active);$('head').innerHTML='';$('body').innerHTML='';if(!t)return;const h=document.createElement('tr');t.columns.forEach(c=>{const x=document.createElement('th');x.className='p-2 text-left';x.textContent=c;h.append(x);});const a=document.createElement('th');a.textContent='Ações';h.append(a);$('head').append(h);(t.rows||[]).forEach((row,i)=>{const tr=document.createElement('tr');t.columns.forEach((c,j)=>{const td=document.createElement('td');td.className='p-2 min-w-36';const x=document.createElement('input');x.value=row[j]??'';x.className='border rounded p-1 w-full';td.append(x);tr.append(td);});const td=document.createElement('td');const save=document.createElement('button');save.textContent='Salvar';save.className='bg-indigo-600 text-white rounded p-2 mr-2';save.onclick=async()=>{try{await api('/admin','PUT',{sheetName:t.name,rowIndex:i,row:[...tr.querySelectorAll('input')].map(x=>x.value)});message('Registro salvo.');}catch(e){message(e.message,true);}};const del=document.createElement('button');del.textContent='Excluir';del.className='bg-red-600 text-white rounded p-2';del.onclick=async()=>{if(confirm('Excluir definitivamente este item?'))try{await api('/admin','DELETE',{sheetName:t.name,rowIndex:i});t.rows.splice(i,1);rows();message('Item excluído.');}catch(e){message(e.message,true);}};td.append(save,del);tr.append(td);$('body').append(tr);});$('count').textContent=(t.rows||[]).length+' registros';}
function userRows(){$('users').innerHTML='';users.forEach(u=>{const tr=document.createElement('tr');const isProtected=!!protectedUsername&&u.username.toLowerCase()===protectedUsername;const cell=v=>{const x=document.createElement('td');x.className='p-2';x.textContent=v;return x;};const n=cell(u.username),id=cell(u.id);id.className+=' font-mono text-xs';const lev=cell('');const s=document.createElement('select');s.className='border rounded p-1';[1,2,3].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent='Nível '+v;o.selected=v===u.accessLevel;s.append(o);});s.disabled=u.id===me||isProtected;lev.append(s);const act=cell('');const save=document.createElement('button');save.textContent='Salvar nível';save.className='border rounded p-1 mr-2';save.disabled=u.id===me||isProtected;save.onclick=async()=>{try{await api('/admin','PUT',{userId:u.id,accessLevel:+s.value});message('Nível atualizado.');}catch(e){message(e.message,true);}};const del=document.createElement('button');del.textContent='Excluir conta';del.className='text-red-600 border rounded p-1';del.disabled=u.id===me||isProtected;del.onclick=async()=>{if(confirm('Excluir conta '+u.username+'?'))try{await api('/admin','DELETE',{userId:u.id});await load();message('Conta excluída.');}catch(e){message(e.message,true);}};if(isProtected){const lock=cell('Conta principal protegida');lock.className='p-2 text-amber-700 font-semibold';act.append(lock);}else act.append(save,del);tr.append(n,id,lev,act);$('users').append(tr);});}
$('tab').onchange=e=>{active=e.target.value;rows();};$('refresh').onclick=()=>load().then(()=>message('Atualizado.')).catch(e=>message(e.message,true));$('create').onclick=async()=>{try{await api('/admin','POST',{username:$('nu').value,password:$('np').value,accessLevel:+$('nl').value});$('nu').value='';$('np').value='';await load();message('Usuário criado.');}catch(e){message(e.message,true);}};$('logout').onclick=()=>{sessionStorage.removeItem('garantias_token');location.replace('/login');};
(async()=>{if(!token){location.replace('/login?next=%2Fadmin.html');return;}try{const s=await api('/auth');if(s.user.accessLevel!==1){location.replace('/');return;}await load();message('Painel carregado.');}catch(e){sessionStorage.removeItem('garantias_token');location.replace('/login?next=%2Fadmin.html');}})();
</script></body></html>
