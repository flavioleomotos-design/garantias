<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fa">
<title>Login | Garantias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{box-sizing:border-box}
:root{font-family:"Open Sans",sans-serif;color:#1c2938;background:#f5f7fa;font-synthesis:none;text-rendering:optimizeLegibility}
body{min-height:100vh;margin:0;padding:24px;display:flex;align-items:center;justify-content:center;background:#f5f7fa}
.login-card{width:100%;max-width:410px;padding:38px 36px 30px;background:#fff;border:1px solid #e7ebf0;border-radius:16px;box-shadow:0 12px 36px rgba(22,39,58,.07)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;color:#173b53;font-size:20px;font-weight:800;letter-spacing:-.6px}
.brand i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#edf4f7;color:#176b87;font-size:17px}
.heading{text-align:center;margin-bottom:25px}
.heading h1{margin:0 0 7px;font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-.6px;color:#1d2d3d}
.heading p{margin:0;color:#7b8794;font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:24px;border-radius:9px;background:#f2f4f7}
.tabs button{height:38px;border:0;border-radius:7px;background:transparent;color:#718096;font:600 12px "Open Sans",sans-serif;cursor:pointer}
.tabs button.active{background:#fff;color:#176b87;box-shadow:0 1px 4px rgba(20,35,50,.1)}
.field{display:block;margin-bottom:17px;color:#39485a;font-size:12px;font-weight:600}
.field-wrap{position:relative;display:block;margin-top:7px}
.field-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#98a4b1;font-size:13px}
.field input{width:100%;height:45px;padding:0 13px 0 38px;border:1px solid #dce2e9;border-radius:8px;background:#fff;color:#243244;font:400 13px "Open Sans",sans-serif;outline:none;transition:border-color .18s,box-shadow .18s}
.field input::placeholder{color:#a4aeb9}
.field input:focus{border-color:#25809a;box-shadow:0 0 0 3px rgba(37,128,154,.1)}
.hint{margin:0 0 15px;color:#8793a0;font-size:11px;line-height:1.5}
.submit{width:100%;height:45px;border:0;border-radius:8px;background:#176b87;color:#fff;font:700 13px "Open Sans",sans-serif;cursor:pointer;transition:background .18s}
.submit:hover{background:#125970}
.submit:disabled{opacity:.65;cursor:wait}
.error{min-height:18px;margin:10px 0 0;color:#c43f4e;font-size:12px;line-height:1.5}
@media(max-width:480px){body{padding:16px;background:#fff}.login-card{padding:30px 22px;border:0;box-shadow:none}.brand{margin-bottom:25px}}
</style>
</head>
<body>
<main class="login-card">
  <div class="brand"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i><span>GARANTIAS</span></div>
  <header class="heading">
    <h1 id="heading-title">Acesse sua conta</h1>
    <p id="heading-subtitle">Entre com seu usuário e senha.</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Acesso">
    <button type="button" id="lt" class="active" role="tab" aria-selected="true">Entrar</button>
    <button type="button" id="rt" role="tab" aria-selected="false">Criar conta</button>
  </div>
  <form id="f">
    <label class="field">Usuário
      <span class="field-wrap"><i class="fa-regular fa-user" aria-hidden="true"></i><input id="u" required minlength="3" maxlength="32" autocomplete="username" placeholder="Digite seu usuário"></span>
    </label>
    <label class="field">Senha
      <span class="field-wrap"><i class="fa-solid fa-lock" aria-hidden="true"></i><input id="p" type="password" required minlength="8" autocomplete="current-password" placeholder="Mínimo de 8 caracteres"></span>
    </label>
    <p id="hint" class="hint">Use seus dados cadastrados para entrar.</p>
    <button id="submit" class="submit" type="submit">Entrar</button>
    <p id="err" class="error" role="alert" aria-live="polite"></p>
  </form>
</main>
<script>
let mode='login';
const $=id=>document.getElementById(id);
function set(m){
  mode=m;
  const login=m==='login';
  $('lt').className=login?'active':'';
  $('rt').className=login?'':'active';
  $('lt').setAttribute('aria-selected',String(login));
  $('rt').setAttribute('aria-selected',String(!login));
  $('heading-title').textContent=login?'Acesse sua conta':'Crie sua conta';
  $('heading-subtitle').textContent=login?'Entre com seu usuário e senha.':'Preencha os campos para criar seu acesso.';
  $('hint').textContent=login?'Use seus dados cadastrados para entrar.':'Novas contas recebem nível 3 (somente visualização).';
  $('submit').textContent=login?'Entrar':'Criar conta';
  $('p').setAttribute('autocomplete',login?'current-password':'new-password');
  $('err').textContent='';
}
$('lt').onclick=()=>set('login');
$('rt').onclick=()=>set('register');
$('f').onsubmit=async e=>{
  e.preventDefault();
  $('err').textContent='';
  if($('p').value.length<8){$('err').textContent='A senha deve ter pelo menos 8 caracteres.';return;}
  const btn=$('submit');btn.disabled=true;
  try{
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:mode,username:$('u').value,password:$('p').value})});
    const d=await r.json();
    if(!r.ok)throw Error(d.message);
    sessionStorage.setItem('garantias_token',d.token);
    const n=new URLSearchParams(location.search).get('next')||'/';
    location.replace(n.startsWith('/')&&!n.startsWith('//')?n:'/');
  }catch(x){$('err').textContent=x.message||'Não foi possível autenticar. Tente novamente.';}
  finally{btn.disabled=false;}
};
</script>
</body>
</html>
