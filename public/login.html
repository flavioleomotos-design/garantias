<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Garantias</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-100 flex items-center justify-center p-4"><main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-7 space-y-5"><div class="text-center"><h1 class="text-2xl font-bold text-indigo-800">Garantias</h1><p class="text-sm text-slate-500">Acesse ou crie sua conta</p></div><div class="flex bg-slate-100 rounded-lg p-1"><button id="lt" class="flex-1 py-2 rounded bg-white shadow">Entrar</button><button id="rt" class="flex-1 py-2 rounded">Criar conta</button></div><form id="f" class="space-y-3"><label class="block text-sm">Usuário<input id="u" required minlength="3" maxlength="32" autocomplete="username" class="mt-1 w-full border rounded-lg p-2" placeholder="3 a 32 caracteres"></label><label class="block text-sm">Senha<input id="p" type="password" required minlength="8" autocomplete="current-password" class="mt-1 w-full border rounded-lg p-2" placeholder="Mínimo de 8 caracteres"></label><p id="hint" class="text-xs text-slate-500">Entre com seu usuário e senha.</p><button id="submit" class="w-full bg-indigo-600 text-white rounded-lg p-2">Entrar</button><p id="err" class="text-sm text-red-600"></p></form></main><script>let mode='login';const $=x=>document.getElementById(x);function set(m){mode=m;$('lt').className='flex-1 py-2 rounded '+(m==='login'?'bg-white shadow':'');$('rt').className='flex-1 py-2 rounded '+(m==='register'?'bg-white shadow':'');$('submit').textContent=m==='login'?'Entrar':'Criar conta';$('hint').textContent=m==='login'?'Entre com seu usuário e senha.':'Novas contas recebem nível 3 (somente visualização).';$('err').textContent='';}$('lt').onclick=()=>set('login');$('rt').onclick=()=>set('register');$('f').onsubmit=async e=>{e.preventDefault();$('err').textContent='';if($('p').value.length<8){$('err').textContent='A senha deve ter pelo menos 8 caracteres.';return;}try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:mode,username:$('u').value,password:$('p').value})});const d=await r.json();if(!r.ok)throw Error(d.message);sessionStorage.setItem('garantias_token',d.token);const n=new URLSearchParams(location.search).get('next')||'/';location.replace(n.startsWith('/')&&!n.startsWith('//')?n:'/');}catch(x){$('err').textContent=x.message;}};</script></body></html>
